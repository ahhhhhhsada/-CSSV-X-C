name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python source
        shell: pwsh
        run: python -m py_compile main.py

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "BOM_AVL_Integrated_Tool" `
            --collect-all pandas `
            --collect-all openpyxl `
            --hidden-import xlrd `
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BOM_AVL_Integrated_Tool.exe")) {
            throw "EXE build failed: output file not found."
          }
          Get-Item "dist/BOM_AVL_Integrated_Tool.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOM_AVL_Integrated_Tool_Windows
          path: dist/BOM_AVL_Integrated_Tool.exe
          if-no-files-found: error
          retention-days: 30
